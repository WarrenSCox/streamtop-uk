<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9AB2D4">
  <meta name="description" content="WozzaWatch brings UK streaming and cinema charts together, using official sources first and clearly labelled fallbacks.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5.3.36">
  <title>WozzaWatch</title>
  <meta name="build" content="5.3.36">
</head>
<body>
  <header class="topbar">
    <div class="brand-cluster">
      <div class="brand">
        <img src="icon.svg" alt="" class="brand-icon">
        <h1>WOZZA<span>WATCH</span></h1>
      </div>
      <a class="sister-switch sister-brand compact-brand" href="tune.html" aria-label="Open WozzaTune" title="Open WozzaTune"><img src="tune-icon.svg" alt=""></a><a class="sister-switch list-switch compact-brand" href="my-list.html" aria-label="Open Watchlist" title="Watchlist"><img src="my-list-icon.svg" alt=""></a>
    </div>
    <div class="header-copy" aria-label="WozzaWatch tagline and last update">
      <strong>ONE PLACE.<br>EVERY TOP TEN.</strong>
      <span id="updatedText">Loading rankings…</span>
    </div>
  </header><div class="wozza-menu-backdrop" id="wozzaMenuBackdrop" hidden></div>
<aside class="wozza-menu" id="wozzaMenu" aria-hidden="true" aria-label="All Wozzas">
  <div class="wozza-menu-title">ALL WOZZAS</div>
  <div class="wozza-menu-list" id="wozzaMenuList">
    <button type="button" class="wozza-menu-item" data-wozza="watch" data-href="index.html"><span class="wozza-menu-rank">01</span><img src="icon.svg" alt=""><span>WozzaWatch</span></button>
    <button type="button" class="wozza-menu-item" data-wozza="tune" data-href="tune.html"><span class="wozza-menu-rank">02</span><img src="tune-icon.svg" alt=""><span>WozzaTune</span></button>
    <button type="button" class="wozza-menu-item" data-wozza="list" data-href="my-list.html"><span class="wozza-menu-rank">03</span><img src="my-list-icon.svg" alt=""><span>Watchlist</span></button>
    <button type="button" class="wozza-menu-item prototype-item" data-wozza="read"><span class="wozza-menu-rank">04</span><img src="read-icon.png" alt=""><span>WozzaRead</span></button>
    <button type="button" class="wozza-menu-item" data-wozza="news" data-href="news.html"><span class="wozza-menu-rank">05</span><img src="news-icon.png" alt=""><span>WozzaNews</span></button>
  </div>
  <button type="button" class="wozza-menu-back" aria-label="Close All Wozzas menu">← BACK</button>
</aside>

  <main>
    <nav id="serviceTabs" class="service-tabs" aria-label="Streaming services and cinema charts"></nav>

    <section class="controls">
      <div class="segmented" aria-label="Choose chart type">
        <button type="button" data-type="MOVIE" class="active icon-toggle" aria-label="Movies" title="Movies">
          <svg class="media-icon clapper-icon" viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="clapperTopClip"><rect x="12" y="10" width="40" height="11" rx="5.5"/></clipPath></defs><rect x="12" y="24" width="40" height="28" rx="7" fill="currentColor"/><g class="clapper-top" transform="rotate(-9 32 15.5)"><rect x="12" y="10" width="40" height="11" rx="5.5" fill="currentColor"/><g clip-path="url(#clapperTopClip)" fill="#eef0fb"><path d="M15 8h9l-6 15H9z"/><path d="M31 8h9l-6 15h-9z"/><path d="M47 8h9l-6 15h-9z"/></g></g><rect x="18" y="32" width="28" height="5" rx="2.5" fill="#eef0fb"/><rect x="18" y="42" width="20" height="5" rx="2.5" fill="#eef0fb"/></svg>
        </button>
        <button type="button" data-type="COMBINED" class="combined-toggle" aria-label="Disney combined Top 10" title="Disney combined Top 10">&amp;</button>
        <button type="button" data-type="SHOW" class="icon-toggle" aria-label="TV shows" title="TV shows">
          <svg class="media-icon remote-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="21" y="5" width="22" height="54" rx="8" fill="currentColor"/>
            <circle cx="32" cy="17" r="4" fill="#eef0fb"/>
            <circle cx="27" cy="27" r="2.5" fill="#eef0fb"/>
            <circle cx="37" cy="27" r="2.5" fill="#eef0fb"/>
            <circle cx="27" cy="35" r="2.5" fill="#eef0fb"/>
            <circle cx="37" cy="35" r="2.5" fill="#eef0fb"/>
            <circle cx="32" cy="47" r="6" fill="none" stroke="#eef0fb" stroke-width="3"/>
          </svg>
        </button>
      </div>
      <button id="installBtn" class="install-btn hidden" type="button">＋ Add WozzaWatch to phone</button>
    </section>

    <section class="chart-wrap">
      <div class="chart-heading">
        <h2 id="chartTitle">Netflix Movies</h2>
        <a id="sourceBadge" class="source-badge" target="_blank" rel="noopener">Loading</a>
      </div>
      <div id="loading" class="loading-list">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <ol id="chart" class="chart"></ol>
      <div id="errorBox" class="error-box hidden">
        <strong>Ranking unavailable</strong>
        <p id="errorText"></p>
        <a id="fallbackLink" target="_blank" rel="noopener">Open source</a>
      </div>
    </section>
  </main>

  <footer><p>App created by Warren · v5.3.36</p></footer>
  <script src="app.js?v=5.3.36" defer></script>
</body>
</html>
