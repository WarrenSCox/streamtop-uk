name: Update WozzaWatch rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'update-data.mjs'
      - '.github/workflows/update-rankings.yml'

permissions:
  contents: write

concurrency:
  group: streamtop-rankings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch UK rankings
        run: node update-data.mjs

      - name: Save refreshed rankings
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated file safe while we sync with any
          # commits that landed during the fetch step.
          cp data/rankings.json /tmp/rankings.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/rankings.json data/rankings.json
            git add data/rankings.json

            if git diff --cached --quiet; then
              echo "No ranking changes to commit."
              exit 0
            fi

            git commit -m "Update streaming rankings"

            if git push origin HEAD:main; then
              echo "Rankings updated successfully."
              exit 0
            fi

            echo "Main changed while saving rankings; retrying ($attempt/3)..."
          done

          echo "Could not save rankings after 3 attempts."
          exit 1
