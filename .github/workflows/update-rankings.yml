name: Update WozzaWatch rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'update-data.mjs'
      - '.github/workflows/update-rankings.yml'

permissions:
  contents: write

concurrency:
  group: streamtop-rankings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch UK rankings
        run: node update-data.mjs

      - name: Save refreshed rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
          else
            git commit -m "Update streaming rankings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
