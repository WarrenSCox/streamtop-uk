name: Update WozzaWatch rankings

on:
  workflow_dispatch:
  schedule:
    # News: twice an hour
    - cron: '7,37 * * * *'
    # Rankings: every 6 hours
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'update-data.mjs'
      - 'update-news.mjs'
      - 'update-read.mjs'
      - '.github/workflows/update-rankings.yml'

permissions:
  contents: write

concurrency:
  group: streamtop-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch UK rankings
        if: github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *'
        run: node update-data.mjs

      - name: Fetch Sky News RSS
        run: node update-news.mjs

      - name: Fetch WozzaRead charts
        run: node update-read.mjs

      - name: Save refreshed data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/wozzawatch-save
          [ -f data/rankings.json ] && cp data/rankings.json /tmp/wozzawatch-save/rankings.json || true
          cp news.json /tmp/wozzawatch-save/news.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            [ -f /tmp/wozzawatch-save/rankings.json ] && cp /tmp/wozzawatch-save/rankings.json data/rankings.json || true
            cp /tmp/wozzawatch-save/news.json news.json

            git add news.json
            [ -f data/rankings.json ] && git add data/rankings.json || true

            if git diff --cached --quiet; then
              echo "No ranking/news changes to commit."
              exit 0
            fi

            git commit -m "Update WozzaWatch rankings and news"

            if git push origin HEAD:main; then
              echo "WozzaWatch data updated successfully."
              exit 0
            fi

            echo "Main changed while saving; retrying ($attempt/3)..."
          done

          echo "Could not save refreshed data after 3 attempts."
          exit 1
