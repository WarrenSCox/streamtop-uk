<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9AB2D4">
  <meta name="description" content="My List — titles saved from WozzaWatch.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="my-list-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5.1">
  <title>My List · WozzaWatch</title>
</head>
<body class="my-list-page">
  <header class="topbar">
    <div class="brand-cluster">
      <a class="brand brand-home" href="index.html" aria-label="Open WozzaWatch" style="text-decoration:none">
        <img src="icon.svg" alt="" class="brand-icon">
        <h1>WOZZA<span>WATCH</span></h1>
      </a>
      <a class="sister-switch" href="tune.html" aria-label="Open WozzaTune" title="WozzaTune"><img src="tune-icon.svg" alt=""></a>
      <a class="sister-switch my-list-switch" href="my-list.html" aria-label="My List" title="My List" aria-current="page"><img src="my-list-icon.svg" alt=""></a>
    </div>
    <div class="header-copy">
      <strong>MY LIST.<br>WATCH LATER.</strong>
      <span id="savedText">Saved on this device</span>
    </div>
  </header>
  <main>
    <section class="chart-wrap">
      <div class="chart-heading">
        <h2>My List</h2>
        <span id="listCount" class="list-count">0 saved</span>
      </div>
      <ol id="myList" class="chart"></ol>
      <div id="emptyList" class="empty-list hidden">
        <svg viewBox="0 0 64 36" aria-hidden="true"><path d="M3 18C8 9 14 5 22 5s14 4 19 13c-5 9-11 13-19 13S8 27 3 18Z" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M23 18c5-9 11-13 19-13s14 4 19 13c-5 9-11 13-19 13s-14-4-19-13Z" fill="none" stroke="currentColor" stroke-width="3.5"/></svg>
        <h3>Nothing saved yet</h3>
        <p>Tap the empty eyes beside any film or TV show to add it here.</p>
      </div>
    </section>
  </main>
  <footer><p>App created by Warren · v5.1</p></footer>
  <script src="my-list.js?v=5.1" defer></script>
</body>
</html>
