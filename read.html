<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9AB2D4"><meta name="description" content="WozzaRead — the UK overall Top 10 books and audiobooks.">
<link rel="icon" href="read-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6.1.5"><title>WozzaRead</title><meta name="build" content="6.1.5">
</head><body class="read-page">
<header class="topbar">
 <div class="brand-cluster"><div class="brand read-brand"><img src="read-icon.png" alt="" class="brand-icon"><h1>WOZZA<span>READ</span></h1></div>
 <a class="news-home-switch" href="index.html" aria-label="Back to WozzaWatch"><img src="news-back.svg" alt=""></a></div>
 <div class="header-copy" aria-label="WozzaRead tagline and last update"><strong>ONE PLACE.<br>EVERY BESTSELLER.</strong><span id="readUpdated">Loading charts…</span></div>
</header>
<div class="wozza-menu-backdrop" id="wozzaMenuBackdrop" hidden></div>
<aside class="wozza-menu" id="wozzaMenu" aria-hidden="true" aria-label="All Wozzas">
 <div class="wozza-menu-title">ALL WOZZAS</div><div class="wozza-menu-list" id="wozzaMenuList">
 <button type="button" class="wozza-menu-item" data-wozza="watch" data-href="index.html"><span class="wozza-menu-rank">01</span><img src="icon.svg" alt=""><span>WozzaWatch</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="tune" data-href="tune.html"><span class="wozza-menu-rank">02</span><img src="tune-icon.svg" alt=""><span>WozzaTune</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="list" data-href="my-list.html"><span class="wozza-menu-rank">03</span><img src="my-list-icon.svg" alt=""><span>Watchlist</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="read" data-href="read.html"><span class="wozza-menu-rank">04</span><img src="read-icon.png" alt=""><span>WozzaRead</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="news" data-href="news.html"><span class="wozza-menu-rank">05</span><img src="news-icon.png" alt=""><span>WozzaNews</span></button>
 </div><button type="button" class="wozza-menu-back" aria-label="Close All Wozzas menu">← BACK</button>
</aside>
<main>
<section class="controls read-controls">
 <div class="segmented read-segmented" aria-label="Choose reading chart type">
  <button type="button" class="read-tab active" data-read-type="BOOKS" aria-label="Books" title="Books">
   <svg class="media-icon book-list-icon read-book-icon" viewBox="0 0 64 64" aria-hidden="true"><path class="book-page-flip" d="M10 13c8-3 15-2 22 3v36c-7-5-14-6-22-3V13Z" fill="currentColor"/><path d="M54 13c-8-3-15-2-22 3v36c7-5 14-6 22-3V13Z" fill="currentColor"/><path d="M32 16v36" fill="none" stroke="#eef0fb" stroke-width="3"/></svg>
  </button>
  <button type="button" class="read-tab" data-read-type="AUDIOBOOKS" aria-label="Audiobooks" title="Audiobooks">
   <svg class="media-icon read-audio-icon" viewBox="0 0 64 64" aria-hidden="true">
    <g fill="currentColor">
      <path d="M9 17c0-4 3-7 7-7h8c4 0 7 3 7 7v3c0 4-3 7-7 7h-4v5h-5v-6c-4-1-6-4-6-8v-1Zm9-2c-2 0-4 2-4 4v1h12v-3c0-1-1-2-3-2h-5Z"/>
      <path d="M38 12c0-4 3-7 7-7h6c4 0 7 3 7 7v3c0 4-3 7-7 7h-3v5h-5v-6c-3-1-5-4-5-7v-2Zm8-2c-2 0-3 2-3 4v1h10v-3c0-1-1-2-3-2h-4Z"/>
    </g>
    <path class="audio-wire" d="M17 31c0 7 4 11 11 15 8 4 12 7 12 12 0 2-.7 4-2 5M46 26c0 8-4 13-11 17" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
  </button>
 </div>
</section>
<section class="chart-wrap read-chart-wrap"><div class="chart-heading read-chart-heading"><h2 id="readTitle">UK TOP 10 BOOKS</h2><a id="readSourceBadge" class="source-badge official" target="_blank" rel="noopener">STATS FROM LOVEREADING</a></div>
<ol id="readChart" class="chart read-chart"></ol><div id="readError" class="error-box hidden"><strong>Chart unavailable</strong><p>The last verified chart will stay in place until a complete Top 10 can be confirmed.</p></div></section>
</main><footer><p>App created by Warren · v6.1.5</p></footer><script src="read.js?v=6.1.5" defer></script>
</body></html>
