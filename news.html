<div class="wozza-menu-backdrop" id="wozzaMenuBackdrop" hidden></div>
<aside class="wozza-menu" id="wozzaMenu" aria-hidden="true" aria-label="All Wozzas">
 <div class="wozza-menu-title">ALL WOZZAS</div><div class="wozza-menu-list" id="wozzaMenuList">
 <button type="button" class="wozza-menu-item" data-wozza="watch" data-href="index.html"><span class="wozza-menu-rank">01</span><img src="icon.svg" alt=""><span>WozzaWatch</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="tune" data-href="tune.html"><span class="wozza-menu-rank">02</span><img src="tune-icon.svg" alt=""><span>WozzaTune</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="list" data-href="my-list.html"><span class="wozza-menu-rank">03</span><img src="my-list-icon.svg" alt=""><span>Watchlist</span></button>
 <button type="button" class="wozza-menu-item prototype-item" data-wozza="read"><span class="wozza-menu-rank">04</span><img src="read-icon.png" alt=""><span>WozzaRead</span></button>
 <button type="button" class="wozza-menu-item" data-wozza="news" data-href="news.html"><span class="wozza-menu-rank">05</span><img src="news-icon.png" alt=""><span>WozzaNews</span></button>
 </div><button type="button" class="wozza-menu-back" aria-label="Close All Wozzas menu">← BACK</button>
